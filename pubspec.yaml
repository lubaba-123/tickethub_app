name: tickethub
description: Multi-Business Ticketing & Booking Marketplace
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo/app_icon_square.png"
  adaptive_icon_background: "#1F4E79"
  adaptive_icon_foreground: "assets/logo/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/logo/app_icon_square.png"
    background_color: "#1F4E79"
    theme_color: "#1F4E79"